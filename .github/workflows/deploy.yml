
name: Publicar panel DENTAL JG

on:
  push:
    branches:
      - main
    paths:
      - "DENTAL_JG_PANEL_10_8_92_REPARACION_CARGA_USUARIOS_4.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Preparar panel web
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Comprobar y extraer ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="DENTAL_JG_PANEL_10_8_92_REPARACION_CARGA_USUARIOS_4.zip"

          echo "Directorio de trabajo:"
          pwd

          echo "Contenido del repositorio:"
          ls -la

          if [ ! -f "$ZIP" ]; then
            echo "::error::No se encontró el ZIP: $ZIP"
            echo "Comprueba que esté en la raíz del repositorio."
            exit 1
          fi

          mkdir -p extracted public

          unzip -oq "$ZIP" -d extracted

          echo "Archivos encontrados dentro del ZIP:"
          find extracted -type f -print

      - name: Preparar archivos del panel
        shell: bash
        run: |
          set -euo pipefail

          INDEX="$(find extracted -type f -name index.html -print -quit)"

          if [ -z "$INDEX" ]; then
            echo "::error::No se encontró index.html dentro del ZIP."
            exit 1
          fi

          PANEL_DIR="$(dirname "$INDEX")"

          echo "Carpeta del panel encontrada:"
          echo "$PANEL_DIR"

          for file in \
            index.html \
            styles.css \
            app.js \
            config.js \
            users.js \
            logo-dental-jg.png
          do
            if [ ! -f "$PANEL_DIR/$file" ]; then
              echo "::error::Falta el archivo requerido: $file"
              echo "Ubicación comprobada: $PANEL_DIR/$file"
              exit 1
            fi

            cp "$PANEL_DIR/$file" public/
            echo "Copiado: $file"
          done

          if [ -d "$PANEL_DIR/supabase" ]; then
            cp -R "$PANEL_DIR/supabase" public/
          fi

          echo "Archivos listos para publicar:"
          ls -lah public

          test -s public/index.html
          test -s public/styles.css
          test -s public/app.js
          test -s public/config.js
          test -s public/users.js
          test -s public/logo-dental-jg.png

      - name: Verificar configuración de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Publicar en GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
        
