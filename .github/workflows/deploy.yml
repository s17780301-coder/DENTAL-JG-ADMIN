            text-shadow: none !important;
          }
          #appPicker .portal-header .portal-subtitle {
            color: #587a76 !important;
            opacity: 1 !important;
            -webkit-text-fill-color: #587a76 !important;
            text-shadow: none !important;
          }
          """
          css.write_text(source, encoding="utf-8")
          print("Corrección de tarjeta blanca aplicada al final de styles.css.")

          # Incrementar la versión del CSS para evitar que el móvil reutilice colores antiguos.
          index = Path("public/index.html")
          html = index.read_text(encoding="utf-8")
          import os
          cache_version = "build-" + os.environ.get("GITHUB_SHA", "local")[:10]
          html, changed = re.subn(r'styles\.css(?:\?v=[^"\']*)?', 'styles.css?v=' + cache_version, html, count=1)
          if changed != 1:
              raise SystemExit("No se pudo forzar una nueva URL de caché para styles.css.")
          html, app_changed = re.subn(r'app\.js(?:\?v=[^"\']*)?', 'app.js?v=' + cache_version, html, count=1)
          if app_changed != 1:
              print("Aviso: no se encontró app.js para actualizar la caché.")
          index.write_text(html, encoding="utf-8")
          print("Caché de estilos y JavaScript forzada con la versión " + cache_version + ".")
          PY

          # No insertar una segunda marca DENTAL JG en la página. La compilación solo versiona la caché del PNG oficial.
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          html_path = Path("public/index.html")
          html = html_path.read_text(encoding="utf-8")
          version = "build-" + os.environ.get("GITHUB_SHA", "local")[:10]
          html = re.sub(r'logo-dental-jg\.png(?:\?v=[^"\']*)?', 'logo-dental-jg.png?v=' + version, html)
          html = re.sub(r'<div id="dental-jg-build-version"[^>]*>.*?</div>', '', html, flags=re.I|re.S)
          html = re.sub(r'<meta name="dental-jg-version"[^>]*>', '', html, flags=re.I)
          html = re.sub(r'<title>.*?</title>', '<title>DENTAL JG | Panel central</title>', html, count=1, flags=re.I|re.S)
          html_path.write_text(html, encoding="utf-8")
          print("Logo oficial con caché renovada; sin etiqueta DENTAL JG adicional.")
          PY

          test -s public/index.html
          echo "Archivos preparados para GitHub Pages:"
          ls -lah public

      - name: Instalar CLI de Supabase
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && hashFiles('supabase/functions/administrar-usuarios/index.ts') != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar función Edge administrar-usuarios en Supabase
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && hashFiles('supabase/functions/administrar-usuarios/index.ts') != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy administrar-usuarios --project-ref nfwhymppyzoriihdwlyc --use-api

      - name: Aviso si falta el token privado de Supabase
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          echo "::warning::El panel web se publicará, pero falta el secreto SUPABASE_ACCESS_TOKEN en GitHub para actualizar la función Edge de Supabase."

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
