name: Publicar panel DENTAL JG
# Revalidación completa: desplegar la Edge Function administrar-usuarios cuando exista SUPABASE_ACCESS_TOKEN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar archivos del panel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public extracted

          # Preferir los archivos ya desplegables en la raíz del repositorio.
          required=(index.html styles.css app.js config.js users.js logo-dental-jg.png)
          root_ready=true
          for file in "${required[@]}"; do
            [[ -s "$file" ]] || root_ready=false
          done

          if [[ "$root_ready" == true ]]; then
            echo "Usando archivos del panel ubicados en la raíz del repositorio."
            panel_dir="."
            cp "${required[@]}" public/
          else
            # No depender de un nombre fijo de ZIP: detectar cualquier ZIP del repositorio
            # que contenga la estructura completa del panel.
            shopt -s nullglob
            zips=( *.zip paquetes/*.zip )
            panel_dir=""
            for zip in "${zips[@]}"; do
              [[ -f "$zip" ]] || continue
              rm -rf extracted/*
              if ! unzip -oq "$zip" -d extracted; then
                echo "Aviso: se omite ZIP no válido: $zip"
                continue
              fi
              while IFS= read -r -d '' candidate; do
                dir="$(dirname "$candidate")"
                complete=true
                for file in "${required[@]}"; do
                  [[ -s "$dir/$file" ]] || complete=false
                done
                if [[ "$complete" == true ]]; then
                  panel_dir="$dir"
                  break
                fi
              done < <(find extracted -type f -name index.html -print0)
              if [[ -n "$panel_dir" ]]; then
                echo "Panel encontrado en $zip: $panel_dir"
                break
              fi
            done

            if [[ -z "$panel_dir" ]]; then
              echo "::error::No se encontraron los archivos del panel ni un ZIP que los contenga."
              echo "Sube index.html, styles.css, app.js, config.js, users.js y logo-dental-jg.png a la raíz, o agrega un ZIP válido en la raíz o en paquetes/."
              echo "Archivos disponibles:"
              find . -maxdepth 3 -type f -not -path './.git/*' | sort | head -200
              exit 1
            fi
            cp "$panel_dir"/{index.html,styles.css,app.js,config.js,users.js,logo-dental-jg.png} public/
          fi

          # Conservar la función del servidor para publicarla por separado en Supabase.
          if [[ -s "$panel_dir/supabase/functions/administrar-usuarios/index.ts" ]]; then
            mkdir -p supabase/functions/administrar-usuarios
            cp "$panel_dir/supabase/functions/administrar-usuarios/index.ts" supabase/functions/administrar-usuarios/index.ts
            cat > supabase/config.toml <<'TOML'
          project_id = "nfwhymppyzoriihdwlyc"

          [functions.administrar-usuarios]
          verify_jwt = true
          TOML
            echo "Función Edge administrar-usuarios preparada para Supabase."
          else
            echo "::warning::El paquete no contiene supabase/functions/administrar-usuarios/index.ts."
          fi

          # Exponer el error de consulta de roles propios para distinguir configuración, consulta o claves.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/functions/administrar-usuarios/index.ts")
          if p.is_file():
              source = p.read_text()
              old = '{ error: "No se pudieron verificar los roles de la cuenta." },'
              new = '{ error: `No se pudieron verificar los roles de la cuenta: ${myRolesError.message}` },'
              if old in source:
                  p.write_text(source.replace(old, new, 1))
                  print("Diagnóstico de my_roles habilitado.")
              else:
                  print("El manejador my_roles ya tiene diagnóstico o usa otra versión.")
          else:
              print("No se encontró la Edge Function para el diagnóstico my_roles.")
          PY

          # Corregir CORS de la Edge Function en cada despliegue. El ZIP puede contener una copia antigua.
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("supabase/functions/administrar-usuarios/index.ts")
          if not p.is_file():
              raise SystemExit("Falta la Edge Function administrar-usuarios/index.ts")

          source = p.read_text(encoding="utf-8")
          origins = '''const ALLOWED_ORIGINS = new Set([
            "https://s17780301-coder.github.io",
            "https://appassets.androidplatform.net",
            "https://localhost",
            "http://localhost",
            "capacitor://localhost",
            "ionic://localhost",
          ]);'''
          pattern = r'const ALLOWED_ORIGINS = new Set\(\[\s*"https://s17780301-coder\.github\.io",\s*\]\);'
          source, changed = re.subn(pattern, origins, source, count=1)
          if changed == 0 and '"https://appassets.androidplatform.net"' not in source:
              raise SystemExit("No se pudo actualizar ALLOWED_ORIGINS; se cancela el despliegue para evitar publicar una función sin corregir.")

          old_headers = '"authorization, x-client-info, apikey, content-type"'
          new_headers = '"authorization, x-client-info, apikey, content-type, x-supabase-api-version, x-supabase-client-platform, x-supabase-client-version, x-supabase-client-runtime, x-supabase-client-runtime-version"'
          if old_headers in source:
              source = source.replace(old_headers, new_headers, 1)
          elif "x-supabase-client-platform" not in source:
              raise SystemExit("No se pudieron actualizar los encabezados CORS; se cancela el despliegue.")

          if '"https://appassets.androidplatform.net"' not in source or "x-supabase-client-platform" not in source:
              raise SystemExit("Falló la verificación final de CORS; no se publicará una función incorrecta.")

          p.write_text(source, encoding="utf-8")
          print("CORS verificado: portal web + Android WebView + encabezados Supabase.")
          PY

          # Añadir delete_user porque la interfaz de Usuarios incluye esa acción.
          # Protege la cuenta actual y el último administrador antes de borrar en Auth.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/functions/administrar-usuarios/index.ts")
          if not p.is_file():
              raise SystemExit("Falta la Edge Function administrar-usuarios/index.ts")
          source = p.read_text(encoding="utf-8")
          if 'if (action === "delete_user")' not in source:
              marker = 'return jsonResponse(\nreq,\n{\nerror: "Acción no reconocida."'
              if source.count(marker) != 1:
                  raise SystemExit("No se encontró de forma única el bloque de acción no reconocida; no se modificó la función.")
              handler = r"""
          if (action === "delete_user") {
          const userId = String(body.user_id ?? "").trim();
          if (!userId) {
          return jsonResponse(req, { error: "Falta user_id." }, 400);
          }
          if (userId === callerData.user.id) {
          return jsonResponse(req, { error: "No puedes eliminar tu propia cuenta desde Administración." }, 400);
          }

          const { data: targetData, error: targetError } =
          await adminClient.auth.admin.getUserById(userId);
          if (targetError || !targetData.user) {
          return jsonResponse(req, { error: "La cuenta indicada no existe." }, 404);
          }

          const { data: targetRoleRows, error: targetRolesError } = await adminClient
          .from("app_user_roles").select("role").eq("user_id", userId);
          if (targetRolesError) {
          console.error("No se pudieron consultar los roles de la cuenta que se quiere eliminar:", targetRolesError.message);
          return jsonResponse(req, { error: "No se pudieron comprobar los permisos de la cuenta." }, 500);
          }

          const targetIsAdmin = (targetRoleRows ?? []).some(
          (row: { role?: string }) => String(row.role ?? "").trim().toLowerCase() === "admin",
          );
          if (targetIsAdmin) {
          const { count, error: adminCountError } = await adminClient
          .from("app_user_roles")
          .select("user_id", { count: "exact", head: true })
          .eq("role", "admin");
          if (adminCountError) {
          console.error("No se pudo contar a los administradores antes de eliminar:", adminCountError.message);
          return jsonResponse(req, { error: "No se pudo verificar si existe otro administrador." }, 500);
          }
          if ((count ?? 0) <= 1) {
          return jsonResponse(req, { error: "No puedes eliminar al último administrador." }, 400);
          }
          }

          const { error: deleteError } = await adminClient.auth.admin.deleteUser(userId);
          if (deleteError) {
          console.error("No se pudo eliminar la cuenta:", deleteError.message);
          return jsonResponse(req, { error: "No se pudo eliminar la cuenta: " + deleteError.message }, 400);
          }

          const { error: cleanupError } = await adminClient
          .from("app_user_roles").delete().eq("user_id", userId);
          if (cleanupError) {
          console.error("Cuenta eliminada; no se pudieron limpiar todos sus roles:", cleanupError.message);
          return jsonResponse(req, { error: "La cuenta se eliminó, pero no se pudieron limpiar sus roles. Revisa app_user_roles." }, 500);
          }

          return jsonResponse(req, { message: "Cuenta eliminada definitivamente." });
          }

          """
              source = source.replace(marker, handler + "\n" + marker, 1)
          if '"delete_user",' not in source:
              source = source.replace('"reset_password",\n],', '"reset_password",\n"delete_user",\n],', 1)
          p.write_text(source, encoding="utf-8")
          print("Acción delete_user verificada y preparada.")
          PY

          # Mostrar el error real de Supabase al iniciar sesión; no modificar usuarios ni contraseñas.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/app.js")
          s = p.read_text()
          old = 'throw new Error("No se pudo iniciar sesión. Verifica correo, contraseña y estado de la cuenta.");'
          new = 'throw new Error("No se pudo iniciar sesión: " + (error.message || "Supabase no devolvió detalles. Verifica las credenciales y el estado de la cuenta."));'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print("Diagnóstico de inicio de sesión habilitado.")
          else:
              print("Aviso: no se encontró la cadena de error esperada; se conserva app.js sin cambios.")
          PY

          # Mostrar un formulario de contraseña nueva cuando Supabase redirige con type=recovery.
          # Se añade al mismo app.js para poder usar el cliente Supabase existente (client).
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/app.js")
          source = p.read_text(encoding="utf-8")
          marker = "// DENTAL_JG_PASSWORD_RECOVERY_FORM"
          if marker not in source:
              source += r"""

          // DENTAL_JG_PASSWORD_RECOVERY_FORM
          (() => {
            const params = new URLSearchParams(window.location.search);
            const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
            const isRecovery = params.get("type") === "recovery" || hash.get("type") === "recovery";
            if (!isRecovery) return;

            const showRecovery = () => {
              if (document.getElementById("dental-jg-recovery-panel")) return;
              const panel = document.createElement("section");
              panel.id = "dental-jg-recovery-panel";
              panel.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#101a23;color:#e8f1f8;font-family:system-ui,sans-serif";
              panel.innerHTML = '<div style="width:min(100%,520px);box-sizing:border-box;padding:28px;border:1px solid #314453;border-radius:24px;background:#182632"><h2 style="margin-top:0">Crear nueva contraseña</h2><p>Escribe tu contraseña nueva para recuperar el acceso a DENTAL JG.</p><form id="dental-jg-recovery-form"><label for="dental-jg-new-password" style="display:block;margin:16px 0 8px">Nueva contraseña</label><input id="dental-jg-new-password" type="password" minlength="8" autocomplete="new-password" required style="box-sizing:border-box;width:100%;padding:14px;border-radius:12px;border:1px solid #405564;background:#101a23;color:#fff;font-size:16px"><label for="dental-jg-confirm-password" style="display:block;margin:16px 0 8px">Confirmar contraseña</label><input id="dental-jg-confirm-password" type="password" minlength="8" autocomplete="new-password" required style="box-sizing:border-box;width:100%;padding:14px;border-radius:12px;border:1px solid #405564;background:#101a23;color:#fff;font-size:16px"><button type="submit" style="margin-top:22px;width:100%;padding:15px;border:0;border-radius:12px;background:#0b928b;color:white;font-size:17px;font-weight:700">Guardar contraseña nueva</button><p id="dental-jg-recovery-status" role="status" style="overflow-wrap:anywhere"></p></form></div>';
              document.body.appendChild(panel);
              const form = panel.querySelector("#dental-jg-recovery-form");
              const status = panel.querySelector("#dental-jg-recovery-status");
              form.addEventListener("submit", async (event) => {
                event.preventDefault();
                const password = panel.querySelector("#dental-jg-new-password").value;
                const confirmation = panel.querySelector("#dental-jg-confirm-password").value;
                if (password.length < 8) { status.textContent = "Usa al menos 8 caracteres."; return; }
                if (password !== confirmation) { status.textContent = "Las contraseñas no coinciden."; return; }
                const button = form.querySelector("button");
                button.disabled = true;
                status.textContent = "Guardando contraseña…";
                try {
                  if (typeof client === "undefined" || !client?.auth) throw new Error("No se encontró la conexión de autenticación. Solicita un enlace nuevo desde el panel.");
                  const { data: sessionData } = await client.auth.getSession();
                  if (!sessionData?.session) {
                    const accessToken = hash.get("access_token") || params.get("access_token");
                    const refreshToken = hash.get("refresh_token") || params.get("refresh_token");
                    if (accessToken && refreshToken) {
                      const { error: sessionError } = await client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
                      if (sessionError) throw sessionError;
                    }
                  }
                  const { error } = await client.auth.updateUser({ password });
                  if (error) throw error;
                  status.textContent = "Contraseña actualizada. Ya puedes volver a iniciar sesión.";
                  window.setTimeout(() => { window.location.href = window.location.origin + window.location.pathname; }, 1800);
                } catch (error) {
                  status.textContent = "No se pudo guardar la contraseña: " + (error?.message || "enlace vencido o inválido");
                  button.disabled = false;
                }
              });
            };
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", showRecovery, { once: true });
            else showRecovery();
          })();
          """
              p.write_text(source, encoding="utf-8")
              print("Formulario de recuperación de contraseña añadido.")
          else:
              print("Formulario de recuperación ya presente.")
          PY

          # Hacer compatible la recuperación con el cliente real del panel y romper caché antigua.
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("public/app.js")
          source = app.read_text(encoding="utf-8")
          marker = "// DENTAL_JG_PASSWORD_RECOVERY_FORM"
          if marker not in source:
              raise SystemExit("Falta el formulario de recuperación en app.js.")
          split = source.index(marker)
          prefix, recovery = source[:split], source[split:]

          recovery, n = re.subn(
              r'const isRecovery = .*?;',
              'const isRecovery = params.get("type") === "recovery" || hash.get("type") === "recovery" || params.has("code") || (params.has("token_hash") || hash.has("access_token") || hash.has("error_description") || params.has("error_code"));',
              recovery, count=1
          )
          if n != 1:
              raise SystemExit("No se pudo normalizar la detección del enlace de recuperación.")

          old_client_check = 'if (typeof client === "undefined" || !client?.auth) throw new Error("No se encontró la conexión de autenticación. Solicita un enlace nuevo desde el panel.");'
          new_client_check = 'const recoveryClient = window.supabase?.createClient(window.DENTAL_CONFIG?.supabaseUrl, window.DENTAL_CONFIG?.supabaseAnonKey); if (!recoveryClient?.auth) throw new Error("No se pudo inicializar la conexión de recuperación de Supabase.");'
          if old_client_check in recovery:
              recovery = recovery.replace(old_client_check, new_client_check, 1)
          elif "const recoveryClient = window.supabase?.createClient" not in recovery:
              raise SystemExit("No se pudo inicializar el cliente de recuperación.")
          recovery = recovery.replace("client.auth.", "recoveryClient.auth.")

          # Procesar el token_hash al enviar el formulario o los tokens clásicos de Supabase.
          old_session_start = 'if (!sessionData?.session) {'
          if old_session_start not in recovery:
              raise SystemExit("No se encontró el bloque de sesión de recuperación.")
          old_token_block = """if (!sessionData?.session) {
                    const accessToken = hash.get("access_token") || params.get("access_token");
                    const refreshToken = hash.get("refresh_token") || params.get("refresh_token");
                    if (accessToken && refreshToken) {
                      const { error: sessionError } = await recoveryClient.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
                      if (sessionError) throw sessionError;
                    }
                  }"""
          new_token_block = """if (!sessionData?.session) {
                    const tokenHash = params.get("token_hash") || hash.get("token_hash");
                    if (tokenHash) {
                      const { error: verifyError } = await recoveryClient.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" });
                      if (verifyError) throw verifyError;
                    } else {
                      const accessToken = hash.get("access_token") || params.get("access_token");
                      const refreshToken = hash.get("refresh_token") || params.get("refresh_token");
                      if (accessToken && refreshToken) {
                        const { error: sessionError } = await recoveryClient.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
                        if (sessionError) throw sessionError;
                      } else {
                        throw new Error("No se detectó la sesión de recuperación. El enlace puede haber caducado o redirigido sin token.");
                      }
                    }
                  }"""
          if old_token_block in recovery:
              recovery = recovery.replace(old_token_block, new_token_block, 1)
          elif 'recoveryClient.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" })' not in recovery:
              pattern = r'if \(!sessionData\?\.session\)\s*\{\s*const accessToken = hash\.get\("access_token"\) \|\| params\.get\("access_token"\);\s*const refreshToken = hash\.get\("refresh_token"\) \|\| params\.get\("refresh_token"\);\s*if \(accessToken && refreshToken\)\s*\{\s*const \{ error: sessionError \} = await recoveryClient\.auth\.setSession\(\{ access_token: accessToken, refresh_token: refreshToken \}\);\s*if \(sessionError\) throw sessionError;\s*\}\s*\}'
              recovery, changed = re.subn(pattern, lambda _: new_token_block, recovery, count=1)
              if changed != 1:
                  raise SystemExit("No se pudo reemplazar el bloque de sesión; se cancela el despliegue.")

          app.write_text(prefix + recovery, encoding="utf-8")

          index = Path("public/index.html")
          html = index.read_text(encoding="utf-8")
          html, changed = re.subn(r'app\.js\?v=[^"\']+', 'app.js?v=1.0.5', html, count=1)
          if changed != 1:
              raise SystemExit("No se pudo actualizar la versión de caché de app.js.")
          index.write_text(html, encoding="utf-8")
          print("Cliente de recuperación inicializado y caché de app.js renovada.")
          PY

          # Añadir autoservicio de correo y contraseña a la cuenta autenticada de Administración.
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path("public/index.html")
          js_path = Path("public/app.js")
          html = html_path.read_text(encoding="utf-8")
          js = js_path.read_text(encoding="utf-8")

          nav_marker = '<div class="profile">'
          if 'id="ownAccountOpen"' not in html:
              if nav_marker not in html:
                  raise SystemExit("No se encontró el perfil lateral para añadir Mi cuenta.")
              html = html.replace(nav_marker, nav_marker, 1)
              profile_end = html.find('</div>', html.find(nav_marker))
              if profile_end < 0:
                  raise SystemExit("No se pudo localizar el bloque de perfil.")
              profile_end += len('</div>')
              html = html[:profile_end] + '\n    <button id="ownAccountOpen" class="secondary" type="button" style="width:100%;margin:10px 0">Mi cuenta y contraseña</button>\n' + html[profile_end:]

          if 'id="ownAccountModal"' not in html:
              modal = '''
          <div id="ownAccountModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="ownAccountTitle" style="position:fixed;inset:0;z-index:10000;background:rgba(5,15,22,.78);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto">
            <section class="panel" style="width:min(100%,560px);max-height:92vh;overflow:auto;background:var(--panel,#fff);padding:24px;border-radius:20px">
              <div class="section-head"><div><p class="eyebrow">SEGURIDAD DE LA CUENTA</p><h3 id="ownAccountTitle">Mi cuenta</h3><p>Cambia tus propios datos de acceso. Tus permisos no se modifican.</p></div></div>
              <form id="ownAccountForm" class="form-grid">
                <label class="full">Correo de acceso<input id="ownAccountEmail" type="email" maxlength="254" autocomplete="email" required></label>
                <label class="full">Nueva contraseña (opcional)<input id="ownAccountPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></label>
                <label class="full">Confirmar nueva contraseña<input id="ownAccountPasswordConfirm" type="password" minlength="8" autocomplete="new-password" placeholder="Repite la nueva contraseña"></label>
                <div class="form-actions full"><button class="primary" type="submit">Guardar cambios</button><button id="ownAccountCancel" class="secondary" type="button">Cerrar</button></div>
                <p id="ownAccountStatus" class="muted full" role="status" aria-live="polite"></p>
              </form>
            </section>
          </div>
          '''
              if '</main>' not in html:
                  raise SystemExit("No se encontró el final del contenido principal para insertar Mi cuenta.")
              html = html.replace('</main>', modal + '\n</main>', 1)

          if '// DENTAL_JG_OWN_ACCOUNT_SETTINGS' not in js:
              insertion = '''
          // DENTAL_JG_OWN_ACCOUNT_SETTINGS
          (() => {
            const openButton = $("ownAccountOpen");
            const modal = $("ownAccountModal");
            const form = $("ownAccountForm");
            if (!openButton || !modal || !form) throw new Error("No se pudo inicializar Mi cuenta.");
            const close = () => modal.classList.add("hidden");
            openButton.addEventListener("click", async () => {
              if (role !== "admin") { note("Solo la cuenta de Administración puede cambiar sus propios datos desde este panel."); return; }
              try {
                const { data, error } = await db.auth.getUser();
                if (error) throw error;
                $("ownAccountEmail").value = data.user?.email || user?.email || "";
                $("ownAccountPassword").value = "";
                $("ownAccountPasswordConfirm").value = "";
                $("ownAccountStatus").textContent = "";
                modal.classList.remove("hidden");
              } catch (error) {
                note("No se pudo cargar tu cuenta: " + (error.message || "error desconocido"));
              }
            });
            $("ownAccountCancel").addEventListener("click", close);
            modal.addEventListener("click", event => { if (event.target === modal) close(); });
            form.addEventListener("submit", async event => {
              event.preventDefault();
              if (role !== "admin") { $("ownAccountStatus").textContent = "Solo disponible para Administración."; return; }
              const email = $("ownAccountEmail").value.trim().toLowerCase();
              const password = $("ownAccountPassword").value;
              const confirmation = $("ownAccountPasswordConfirm").value;
              const status = $("ownAccountStatus");
              const button = form.querySelector('button[type="submit"]');
              if (password && password.length < 8) { status.textContent = "La contraseña debe tener al menos 8 caracteres."; return; }
              if (password !== confirmation) { status.textContent = "Las contraseñas no coinciden."; return; }
              if (!email) { status.textContent = "Escribe un correo válido."; return; }
              const { data: currentData, error: currentError } = await db.auth.getUser();
              if (currentError) { status.textContent = "No se pudo verificar la sesión: " + currentError.message; return; }
              const currentEmail = String(currentData.user?.email || "").trim().toLowerCase();
              const changes = {};
              if (email !== currentEmail) changes.email = email;
              if (password) changes.password = password;
              if (!Object.keys(changes).length) { status.textContent = "No hay cambios que guardar."; return; }
              if (!window.confirm("¿Confirmas guardar los cambios de tu cuenta?")) return;
              button.disabled = true;
