name: Publicar panel DENTAL JG

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read
pages: write
id-token: write

jobs:
publicar:
runs-on: ubuntu-latest
steps:
- name: Descargar archivos
uses: actions/checkout@v4

  - name: Verificar archivos
    run: |
      mkdir -p public
      test -f index.html
      test -f app.js
      test -f styles.css
      test -f config.js
      cp index.html app.js styles.css config.js public/

  - name: Configurar Pages
    uses: actions/configure-pages@v5

  - name: Subir archivos
    uses: actions/upload-pages-artifact@v3
    with:
      path: public

  - name: Publicar sitio
    uses: actions/deploy-pages@v4
