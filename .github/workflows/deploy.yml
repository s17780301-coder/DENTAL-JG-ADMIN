      - name: Instalar CLI de Supabase
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && hashFiles('supabase/functions/administrar-usuarios/index.ts') != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar función Edge administrar-usuarios en Supabase
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && hashFiles('supabase/functions/administrar-usuarios/index.ts') != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy administrar-usuarios --project-ref nfwhymppyzoriihdwlyc --use-api

      - name: Aviso si falta el token privado de Supabase
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          echo "::warning::El panel web se publicará, pero falta el secreto SUPABASE_ACCESS_TOKEN en GitHub para actualizar la función Edge de Supabase."

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
