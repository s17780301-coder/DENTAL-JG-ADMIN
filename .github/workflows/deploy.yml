name: Publicar panel DENTAL JG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer ZIP del panel
        run: |
          set -euo pipefail
          ZIP="DENTAL_JG_PANEL_ROLES_RECONSTRUIDO_DESDE_CERO.zip"
          if [[ ! -f "$ZIP" ]]; then
            echo "ERROR: No existe $ZIP en la raíz del repositorio."
            echo "Archivos disponibles:"
            find . -maxdepth 3 -type f -not -path './.git/*' | sort | head -200
            exit 1
          fi
          mkdir -p extracted public
          unzip -o "$ZIP" -d extracted

          PANEL_DIR=""
          while IFS= read -r -d '' candidate; do
            dir="$(dirname "$candidate")"
            if [[ -f "$dir/index.html" && -f "$dir/styles.css" && -f "$dir/app.js" && -f "$dir/config.js" && -f "$dir/users.js" && -f "$dir/logo-dental-jg.png" ]]; then
              PANEL_DIR="$dir"
              break
            fi
          done < <(find extracted -type f -name index.html -print0)

          if [[ -z "$PANEL_DIR" ]]; then
            echo 'ERROR: El ZIP no contiene todos los archivos requeridos del panel.'
            echo 'Contenido extraído:'
            find extracted -type f | sort
            exit 1
          fi

          echo "Panel encontrado en: $PANEL_DIR"
          cp "$PANEL_DIR/index.html" "$PANEL_DIR/styles.css" "$PANEL_DIR/app.js" "$PANEL_DIR/config.js" "$PANEL_DIR/users.js" "$PANEL_DIR/logo-dental-jg.png" public/
          test -s public/index.html
          ls -lah public

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
