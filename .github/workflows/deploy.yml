
      - name: Verificar archivos
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f config.js
          test -f users.js

      - name: Preparar carpeta
        run: |
          mkdir -p public
          cp index.html app.js styles.css config.js users.js public/
          
