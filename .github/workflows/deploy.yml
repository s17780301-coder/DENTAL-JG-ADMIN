name: Publicar panel DENTAL JG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar archivos del panel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public extracted

          # Preferir los archivos ya desplegables en la raíz del repositorio.
          required=(index.html styles.css app.js config.js users.js logo-dental-jg.png)
          root_ready=true
          for file in "${required[@]}"; do
            [[ -s "$file" ]] || root_ready=false
          done

          if [[ "$root_ready" == true ]]; then
            echo "Usando archivos del panel ubicados en la raíz del repositorio."
            panel_dir="."
            cp "${required[@]}" public/
          else
            # No depender de un nombre fijo de ZIP: detectar cualquier ZIP del repositorio
            # que contenga la estructura completa del panel.
            shopt -s nullglob
            zips=( *.zip paquetes/*.zip )
            panel_dir=""
            for zip in "${zips[@]}"; do
              [[ -f "$zip" ]] || continue
              rm -rf extracted/*
              if ! unzip -oq "$zip" -d extracted; then
                echo "Aviso: se omite ZIP no válido: $zip"
                continue
              fi
              while IFS= read -r -d '' candidate; do
                dir="$(dirname "$candidate")"
                complete=true
                for file in "${required[@]}"; do
                  [[ -s "$dir/$file" ]] || complete=false
                done
                if [[ "$complete" == true ]]; then
                  panel_dir="$dir"
                  break
                fi
              done < <(find extracted -type f -name index.html -print0)
              if [[ -n "$panel_dir" ]]; then
                echo "Panel encontrado en $zip: $panel_dir"
                break
              fi
            done

            if [[ -z "$panel_dir" ]]; then
              echo "::error::No se encontraron los archivos del panel ni un ZIP que los contenga."
              echo "Sube index.html, styles.css, app.js, config.js, users.js y logo-dental-jg.png a la raíz, o agrega un ZIP válido en la raíz o en paquetes/."
              echo "Archivos disponibles:"
              find . -maxdepth 3 -type f -not -path './.git/*' | sort | head -200
              exit 1
            fi
            cp "$panel_dir"/{index.html,styles.css,app.js,config.js,users.js,logo-dental-jg.png} public/
          fi

          # Conservar la función del servidor para publicarla por separado en Supabase.
          if [[ -s "$panel_dir/supabase/functions/administrar-usuarios/index.ts" ]]; then
            mkdir -p supabase/functions/administrar-usuarios
            cp "$panel_dir/supabase/functions/administrar-usuarios/index.ts" supabase/functions/administrar-usuarios/index.ts
            cat > supabase/config.toml <<'TOML'
          project_id = "nfwhymppyzoriihdwlyc"

          [functions.administrar-usuarios]
          verify_jwt = true
          TOML
            echo "Función Edge administrar-usuarios preparada para Supabase."
          else
            echo "::warning::El paquete no contiene supabase/functions/administrar-usuarios/index.ts."
          fi

          # Exponer el error de consulta de roles propios para distinguir configuración, consulta o claves.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/functions/administrar-usuarios/index.ts")
          if p.is_file():
              source = p.read_text()
              old = '{ error: "No se pudieron verificar los roles de la cuenta." },'
              new = '{ error: `No se pudieron verificar los roles de la cuenta: ${myRolesError.message}` },'
              if old in source:
                  p.write_text(source.replace(old, new, 1))
                  print("Diagnóstico de my_roles habilitado.")
              else:
                  print("El manejador my_roles ya tiene diagnóstico o usa otra versión.")
          else:
              print("No se encontró la Edge Function para el diagnóstico my_roles.")
          PY

          # Mostrar el error real de Supabase al iniciar sesión; no modificar usuarios ni contraseñas.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/app.js")
          s = p.read_text()
          old = 'throw new Error("No se pudo iniciar sesión. Verifica correo, contraseña y estado de la cuenta.");'
          new = 'throw new Error("No se pudo iniciar sesión: " + (error.message || "Supabase no devolvió detalles. Verifica las credenciales y el estado de la cuenta."));'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print("Diagnóstico de inicio de sesión habilitado.")
          else:
              print("Aviso: no se encontró la cadena de error esperada; se conserva app.js sin cambios.")
          PY

          test -s public/index.html
          echo "Archivos preparados para GitHub Pages:"
          ls -lah public

      - name: Instalar CLI de Supabase
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && hashFiles('supabase/functions/administrar-usuarios/index.ts') != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar función Edge administrar-usuarios en Supabase
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && hashFiles('supabase/functions/administrar-usuarios/index.ts') != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy administrar-usuarios --project-ref nfwhymppyzoriihdwlyc --use-api

      - name: Aviso si falta el token privado de Supabase
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          echo "::warning::El panel web se publicará, pero falta el secreto SUPABASE_ACCESS_TOKEN en GitHub para actualizar la función Edge de Supabase."

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
