
      - name: Descargar y preparar panel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted public

          API_URL="https://api.github.com/repos/s17780301-coder/Gestor-aAsistente/contents/DENTAL_JG_PANEL_10_8_95_TURQUESA_CACH%25C3%2589_CORREGIDA.zip?ref=main"

          echo "Descargando ZIP del panel mediante GitHub API..."
          curl -fLsS --retry 3 \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" -o respuesta.json

          echo "Comprobando respuesta de GitHub..."
          jq -e '.encoding == "base64" and (.content | length > 0)' respuesta.json >/dev/null

          jq -r '.content' respuesta.json | base64 -d > panel.zip

          test -s panel.zip
          echo "Validando archivo ZIP..."
          unzip -tq panel.zip
          unzip -oq panel.zip -d extracted

          INDEX="$(find extracted -type f -name index.html -print -quit)"

          if [ -z "$INDEX" ]; then
            echo "::error::El ZIP descargado no contiene index.html."
            find extracted -maxdepth 5 -type f | head -n 150
            exit 1
          fi

          PANEL_DIR="$(dirname "$INDEX")"
          cp -a "$PANEL_DIR"/. public/

          test -s public/index.html
          touch public/.nojekyll

          echo "Panel preparado correctamente:"
          find public -maxdepth 3 -type f | head -n 100
          
