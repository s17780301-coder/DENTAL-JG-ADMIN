          """
              css.write_text(source, encoding="utf-8")
              print("Tema verde turquesa aplicado a estilos del panel.")
          else:
              print("Tema verde turquesa ya presente; no se duplica.")

          # Incrementar la versión del CSS para evitar que el móvil reutilice colores antiguos.
          index = Path("public/index.html")
          html = index.read_text(encoding="utf-8")
          cache_version = "1.0.5-turquesa2"
          html, changed = re.subn(r'styles\\.css(?:\\?v=[^"\\']*)?', 'styles.css?v=' + cache_version, html, count=1)
          if changed != 1:
              raise SystemExit("No se pudo forzar una nueva URL de caché para styles.css.")
