
name: Publicar panel DENTAL JG

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Preparar panel web
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Buscar y extraer ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted public

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::No hay ningún ZIP en la raíz del repositorio."
            echo "Sube primero el ZIP del panel DENTAL JG."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          unzip -oq "$ZIP" -d extracted

          INDEX="$(find extracted -type f -name index.html -print -quit)"

          if [ -z "$INDEX" ]; then
            echo "::error::El ZIP no contiene index.html."
            echo "Contenido del ZIP:"
            find extracted -maxdepth 5 -type f -print | head -n 150
            exit 1
          fi

          PANEL_DIR="$(dirname "$INDEX")"
          echo "Carpeta del panel: $PANEL_DIR"

          cp -a "$PANEL_DIR"/. public/

          if [ ! -s public/index.html ]; then
            echo "::error::No se encontró un index.html válido para publicar."
            exit 1
          fi

          touch public/.nojekyll

          echo "Archivos preparados:"
          find public -maxdepth 3 -type f -print | head -n 150

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
        
