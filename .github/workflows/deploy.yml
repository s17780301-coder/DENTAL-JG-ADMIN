name: Publicar panel DENTAL JG
# Revalidación completa: desplegar la Edge Function administrar-usuarios cuando exista SUPABASE_ACCESS_TOKEN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar archivos del panel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public extracted

          # Preferir los archivos ya desplegables en la raíz del repositorio.
          required=(index.html styles.css app.js config.js logo-dental-jg.svg)
          root_ready=true
          for file in "${required[@]}"; do
            [[ -s "$file" ]] || root_ready=false
          done

          if [[ "$root_ready" == true ]]; then
            echo "Usando archivos del panel ubicados en la raíz del repositorio."
            panel_dir="."
            cp "${required[@]}" public/
            # Publicar las interfaces web reales incluidas en el paquete de aplicaciones Android.
            # Cada módulo conserva su HTML, CSS, JS y login originales.
            app_bundle="DENTAL_JG_1_0_6_APPS_WEB_SQL_ACTUALIZADO.zip"
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/s17780301-coder/Gestor-aAsistente/main/${app_bundle}" -o "/tmp/${app_bundle}"
            mkdir -p /tmp/dental-apps
            unzip -oq "/tmp/${app_bundle}" -d /tmp/dental-apps
            copy_module() {
              local source="$1" target="$2"
              mkdir -p "$target"
              find "$source" -maxdepth 1 -type f ! -name "*.sql" -exec cp -f {} "$target/" \;
            }
            copy_module "/tmp/dental-apps/djg/registro-app/src/main/assets/registro-web" "public/modules/registro"
            copy_module "/tmp/dental-apps/djg/cobranza-app/src/main/assets" "public/modules/cobranza"
            copy_module "/tmp/dental-apps/djg/panel-apk/src/main/assets" "public/modules/administracion"
            for module in registro cobranza administracion; do
              test -s "public/modules/$module/index.html"
              test -s "public/modules/$module/app.js"
              test -s "public/modules/$module/styles.css"
              test -s "public/modules/$module/config.js"
            done
            echo "Tres interfaces originales preparadas con sus archivos funcionales."
            # Recuperar el PNG original desde el ZIP maestro si está disponible.
            if [[ ! -s public/logo-dental-jg.png ]]; then
              for logo_zip in 00_DENTAL_JG_PANEL_WEB_MAESTRO_1_0_6_ACTUALIZADO.zip *.zip paquetes/*.zip; do
                [[ -f "$logo_zip" ]] || continue
                logo_entry="$(unzip -Z1 "$logo_zip" | grep -E "logo-dental-jg[.]png$" | head -1 || true)"
                if [[ -n "$logo_entry" ]]; then
                  unzip -p "$logo_zip" "$logo_entry" > public/logo-dental-jg.png
                  break
                fi
              done
            fi
                      # El logo oficial horizontal y transparente se toma del mismo paquete que alimenta los módulos.
          test -s public/modules/registro/logo-dental-jg.png || { echo "::error::Falta el PNG oficial dentro del módulo Registro."; exit 1; }
          cp -f public/modules/registro/logo-dental-jg.png public/logo-dental-jg.png

          # Ajustes de acceso y caché de las tres interfaces originales, sin reconstruirlas con pantallas genéricas.
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          modules = Path("public/modules")
          build_id = os.environ.get("GITHUB_SHA", "local")[:10]

          # Registro: aceptar ambos nombres de columna que existen en instalaciones del esquema.
          registration_js = modules / "registro" / "app.js"
          source = registration_js.read_text(encoding="utf-8")
          old = """      const { data, error } = await db.from('app_user_roles')
                  .select('role')
                  .eq('user_id', candidateUser.id)
                  .in('role', ['registro', 'admin']);"""
          new = """      let roleResult = await db.from('app_user_roles')
                  .select('role')
                  .eq('user_id', candidateUser.id)
                  .in('role', ['registro', 'admin']);
                if (roleResult.error && /user_id|column|schema cache|does not exist/i.test(roleResult.error.message || '')) {
                  roleResult = await db.from('app_user_roles')
                    .select('role')
                    .eq('id_usuario', candidateUser.id)
                    .in('role', ['registro', 'admin']);
                }
                const { data, error } = roleResult;"""
          if "let roleResult = await db.from('app_user_roles')" not in source:
              if old not in source:
                  raise SystemExit("No se reconoció el bloque de permisos de Registro; se cancela la publicación.")
              source = source.replace(old, new, 1)
              registration_js.write_text(source, encoding="utf-8")
              print("Registro: consulta de rol compatible con user_id / id_usuario.")
          else:
              print("Registro: alternativa id_usuario ya instalada.")

          # Administración: validar el rol también al restaurar una sesión guardada.
          admin_js = modules / "administracion" / "app.js"
          source = admin_js.read_text(encoding="utf-8")
          if "async function restoreAdminSession(" not in source:
              start = source.find("if(configured){try{client=window.supabase.createClient")
              end = source.find("\n\n  // Panel navegador", start) if start >= 0 else -1
              if start < 0 or end < 0:
                  raise SystemExit("No se reconoció la restauración de sesión de Administración; se cancela la publicación.")
              replacement = r"""
          async function restoreAdminSession(session) {
            if (!session || !client) return;
            try {
              const { data, error } = await client.functions.invoke('administrar-usuarios', { body: { action: 'my_roles' } });
              if (error || data?.error) throw new Error(data?.error || error?.message || 'No se pudieron verificar los permisos.');
              const roles = (Array.isArray(data?.roles) ? data.roles : [])
                .map(role => String(typeof role === 'string' ? role : (role?.role || '')).trim().toLowerCase());
              if (!roles.some(role => ['admin', 'administrator', 'administrador', 'owner'].includes(role))) {
                await client.auth.signOut();
                msg('Acceso denegado: esta cuenta no tiene rol de Administración.');
                return;
              }
              const { data: userData } = await client.auth.getUser();
              if ($('ownCurrentEmail')) $('ownCurrentEmail').value = userData?.user?.email || '';
              showApp();
              await load(true);
              await loadAdminUsers();
              realtime();
            } catch (error) {
              console.error('No se pudo validar el rol al restaurar la sesión', error);
              await client.auth.signOut().catch(() => {});
              msg('No se pudo verificar el permiso de Administración. Inicia sesión de nuevo o revisa administrar-usuarios.');
            }
          }
          if(configured){try{client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});client.auth.getSession().then(({data,error})=>{if(!error&&data&&data.session)restoreAdminSession(data.session);}).catch(err=>console.warn('No se pudo restaurar la sesión',err));client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session&&$('appView').classList.contains('hidden'))restoreAdminSession(session);if(event==='SIGNED_OUT'){$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');}});}catch(err){console.error('No se pudo inicializar la sesión',err);}}
          """
              source = source[:start] + replacement.strip() + source[end:]
              admin_js.write_text(source, encoding="utf-8")
              print("Administración: restauración de sesión protegida con validación de rol.")
          else:
              print("Administración: validación de rol en sesión guardada ya instalada.")

          # El alta de pacientes debe seguir exclusiva de Registro, nunca Administración.
          if "from('patients').insert(payload)" in source or "from(\"patients\").insert(payload)" in source:
              raise SystemExit("La interfaz Administración contiene un alta de pacientes; se cancela el despliegue.")

          # Forzar una URL nueva de recursos y un nombre de caché independiente por compilación en cada app.
          for name in ("registro", "cobranza", "administracion"):
              folder = modules / name
              html_file = folder / "index.html"
              html = html_file.read_text(encoding="utf-8")
              for asset in ("styles.css", "app.js", "config.js", "service-worker.js", "logo-dental-jg.png", "logo-dental-jg.svg", "manifest.webmanifest", "icon-192.png", "icon-512.png", "icon.svg"):
                  pattern = re.escape(asset) + r"(?:\?v=[^\"'\s>]*)?"
                  html = re.sub(pattern, asset + "?v=" + build_id, html)
              html_file.write_text(html, encoding="utf-8")

              sw_file = folder / "service-worker.js"
              if sw_file.is_file():
                  sw = sw_file.read_text(encoding="utf-8")
                  sw, count = re.subn(r"(const\s+(?:CACHE|CACHE_NAME)\s*=\s*)['\"][^'\"]+['\"]", lambda m: m.group(1) + "'dental-jg-" + name + "-" + build_id + "'", sw, count=1)
                  if count == 0:
                      raise SystemExit(f"No se reconoció el nombre de caché del service worker de {name}.")
                  sw_file.write_text(sw, encoding="utf-8")

          # Verificación de navegación, archivos funcionales y preservación del flujo de altas.
          for name in ("registro", "cobranza", "administracion"):
              folder = modules / name
              for filename in ("index.html", "app.js", "styles.css", "config.js"):
                  if not (folder / filename).is_file() or not (folder / filename).stat().st_size:
                      raise SystemExit(f"Falta {filename} en el módulo {name}.")
          admin_source = (modules / "administracion" / "app.js").read_text(encoding="utf-8")
          if "async function restoreAdminSession(" not in admin_source:
              raise SystemExit("Administración no tiene validación de sesión restaurada.")
          if "from('patients').insert(payload)" in admin_source or "from(\"patients\").insert(payload)" in admin_source:
              raise SystemExit("Administración contiene registro directo de pacientes; solo Registro debe poder dar altas.")
          print("Tres módulos originales preparados; permisos, caché y logo oficial verificados.")
          PY

                    # Forzar login explícito en Administración: no restaurar sesiones persistidas entre aperturas.
          # Esto no cambia el login ni la validación del rol que ocurren después de enviar el formulario.
          python3 - <<'PY'
          from pathlib import Path
          import re

          admin_js = Path("public/modules/administracion/app.js")
          source = admin_js.read_text(encoding="utf-8")

          # Eliminar la rutina que abría Administración automáticamente al encontrar una sesión guardada.
          source, removed = re.subn(
              r"\\s*async function restoreAdminSession\\(session\\)\\s*\\{.*?\\}\\s*(?=if\\(configured\\)\\{try\\{client=window\\.supabase\\.createClient)",
              "",
              source,
              count=1,
              flags=re.S,
          )

          # Inicializar el cliente sin leer ni persistir una sesión de aperturas anteriores.
          source, init_count = re.subn(
              r"if\\(configured\\)\\{try\\{client=window\\.supabase\\.createClient[\\s\\S]*?catch\\(err\\)\\{console\\.error\\('No se pudo inicializar la sesión',err\\);\\}\\}",
              "if(configured){try{client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});}catch(err){console.error('No se pudo inicializar la sesión',err);}}",
              source,
              count=1,
          )
          if init_count != 1:
              raise SystemExit("No se pudo desactivar la restauración automática de sesión de Administración.")

          # Asegurar que el cliente de respaldo del formulario use la misma política.
          source = source.replace("persistSession:true", "persistSession:false")
          source = source.replace(",storage:window.localStorage", "")
          if "restoreAdminSession" in source or "client.auth.getSession()" in source:
              raise SystemExit("Administración aún contiene una ruta de inicio automático; se cancela la publicación.")

          admin_js.write_text(source, encoding="utf-8")

          # En Cobranza, el nombre que acompaña al logo debe ser únicamente “Cobranza”.
          cobranza_index = Path("public/modules/cobranza/index.html")
          html = cobranza_index.read_text(encoding="utf-8")
          html = html.replace("Cobranza DENTAL JG", "Cobranza")
          if "Cobranza DENTAL JG" in html:
              raise SystemExit("Quedó texto redundante junto al logo de Cobranza.")
          if '<b>Cobranza</b>' not in html:
              raise SystemExit("No se encontró el encabezado Cobranza esperado tras corregirlo.")
          cobranza_index.write_text(html, encoding="utf-8")

          print("Administración: exige correo y contraseña en cada apertura.")
          print("Cobranza: texto junto al logo corregido a “Cobranza”.")
          PY

          # Mantener la Edge Function existente para que el resto del flujo no la sustituya por una copia vacía.
            if [[ ! -s "supabase/functions/administrar-usuarios/index.ts" ]]; then
              shopt -s nullglob
              for function_zip in *.zip paquetes/*.zip; do
                [[ -f "$function_zip" ]] || continue
                function_entry="$(unzip -Z1 "$function_zip" | grep 'supabase/functions/administrar-usuarios/index.ts' | head -1 || true)"
                if [[ -n "$function_entry" ]]; then
                  mkdir -p supabase/functions/administrar-usuarios
                  unzip -p "$function_zip" "$function_entry" > supabase/functions/administrar-usuarios/index.ts
                  echo "Función Edge recuperada del paquete maestro."
                  break
                fi
              done
            fi
          else
            # No depender de un nombre fijo de ZIP: detectar cualquier ZIP del repositorio
            # que contenga la estructura completa del panel.
            shopt -s nullglob
            zips=( *.zip paquetes/*.zip )
            panel_dir=""
            for zip in "${zips[@]}"; do
              [[ -f "$zip" ]] || continue
              rm -rf extracted/*
              if ! unzip -oq "$zip" -d extracted; then
                echo "Aviso: se omite ZIP no válido: $zip"
                continue
              fi
              # No elegir el primer index.html completo: el ZIP puede contener la app Admon.
              # Seleccionar primero la portada integral que define el selector de módulos appPicker.
              while IFS= read -r -d '' candidate; do
                dir="$(dirname "$candidate")"
                complete=true
                for file in "${required[@]}"; do
                  [[ -s "$dir/$file" ]] || complete=false
                done
                [[ "$complete" == true ]] || continue
                html="$(cat "$candidate")"
                if [[ "$html" == *'id="appPicker"'* && "$html" == *'data-view="patients"'* && "$html" == *'data-view="collection"'* && "$html" == *'data-view="admin"'* ]]; then
                  panel_dir="$dir"
                  echo "Portal integral verificado en $zip: $panel_dir"
                  break
                fi
                echo "Se omite index.html sin selector integral appPicker: $candidate"
              done < <(find extracted -type f -name index.html -print0)
              if [[ -n "$panel_dir" ]]; then
                break
              fi
            done

            if [[ -z "$panel_dir" ]]; then
              echo "::error::No se encontraron los archivos del panel ni un ZIP que los contenga."
              echo "Sube index.html, styles.css, app.js, config.js, users.js y logo-dental-jg.png a la raíz, o agrega un ZIP válido en la raíz o en paquetes/."
              echo "Archivos disponibles:"
              find . -maxdepth 3 -type f -not -path './.git/*' | sort | head -200
              exit 1
            fi
            cp "$panel_dir"/{index.html,styles.css,app.js,config.js,users.js,logo-dental-jg.png} public/
          fi

          # Corregir la restauración de sesión: nunca mostrar el panel antes de validar el rol.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("public/app.js")
          s = p.read_text(encoding="utf-8")
          if "function activateAdminSession" not in s:
              # Versión del paquete maestro que restauraba sesión directamente sin verificar permisos.
              pattern = re.compile(
                  r'client\.auth\.getSession\(\)\.then\(\(\{data,error\}\)\s*=>\s*\{\s*if\(!error&&data&&data\.session\)\{showApp\(\);load\(true\);realtime\(\);\}\s*\}\);\s*'
                  r'client\.auth\.onAuthStateChange\(\(event,session\)\s*=>\s*\{\s*if\(event===\x27SIGNED_IN\x27&&session&&\$\(\x27appView\x27\)\.classList\.contains\(\x27hidden\x27\)\)\{showApp\(\);load\(true\);realtime\(\);\}\s*\}\);'
              )
              if pattern.search(s):
                  replacement = r'''
          async function activateAdminSession() {
            try {
              const { data, error } = await client.functions.invoke("administrar-usuarios", { body: { action: "my_roles" } });
              if (error || data?.error) throw new Error(data?.error || error?.message || "No se pudieron verificar los permisos.");
              const rows = Array.isArray(data?.roles) ? data.roles : [];
              const roles = rows.map(v => String(typeof v === "string" ? v : (v?.role || "")).trim().toLowerCase());
              if (!roles.some(v => ["admin", "administrator", "administrador", "owner"].includes(v))) {
                await client.auth.signOut();
                $("appView").classList.add("hidden");
                $("loginView").classList.remove("hidden");
                const msg = $("loginMessage") || $("loginMsg");
                if (msg) msg.textContent = "Acceso denegado: esta cuenta no tiene el rol de Administración.";
                return;
              }
              showApp(); load(true); realtime();
            } catch (e) {
              await client.auth.signOut().catch(() => {});
              $("appView").classList.add("hidden");
              $("loginView").classList.remove("hidden");
              const msg = $("loginMessage") || $("loginMsg");
              if (msg) msg.textContent = "No se pudieron verificar los permisos de Administración: " + (e?.message || "error desconocido");
            }
          }
          client.auth.getSession().then(({data,error}) => {
            if (!error && data?.session) activateAdminSession();
          });
          client.auth.onAuthStateChange((event, session) => {
            if (event === "SIGNED_OUT") {
              $("appView").classList.add("hidden");
              $("loginView").classList.remove("hidden");
            }
          });''';
                  s = s.replace(pattern, replacement);
                  print("Restauración de sesión protegida con verificación de rol admin.");
              else:
                  # If package already uses role validation, keep it; otherwise fail closed.
                  if "my_roles" not in s:
                      raise SystemExit("ERROR: app.js no contiene una verificación de rol reconocible; se cancela la publicación.")
                  print("La versión de app.js ya incluye comprobación de roles; no se duplicó el control.")
              p.write_text(s, encoding="utf-8")
          else:
              print("La protección de sesión ya está instalada.")
          PY

          # Conservar la función del servidor para publicarla por separado en Supabase.
          if [[ -s "$panel_dir/supabase/functions/administrar-usuarios/index.ts" ]]; then
            mkdir -p supabase/functions/administrar-usuarios
            if [[ "$panel_dir" != "." ]]; then cp "$panel_dir/supabase/functions/administrar-usuarios/index.ts" supabase/functions/administrar-usuarios/index.ts; fi
            cat > supabase/config.toml <<'TOML'
          project_id = "nfwhymppyzoriihdwlyc"

          [functions.administrar-usuarios]
          verify_jwt = true
          TOML
            echo "Función Edge administrar-usuarios preparada para Supabase."
          else
            echo "::warning::El paquete no contiene supabase/functions/administrar-usuarios/index.ts."
          fi

          # Exponer el error de consulta de roles propios para distinguir configuración, consulta o claves.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/functions/administrar-usuarios/index.ts")
          if not p.is_file():
              raise SystemExit("Falta la Edge Function administrar-usuarios/index.ts")
          source = p.read_text(encoding="utf-8")
          old = '{ error: "No se pudieron verificar los roles de la cuenta." },'
          new = '{ error: `No se pudieron verificar los roles de la cuenta: ${myRolesError.message}` },'
          if old in source:
              source = source.replace(old, new, 1)

          start = source.find("const allowedRoles = new Set(")
          marker = "return jsonResponse(req, { roles });"
          end = source.find(marker, start) if start >= 0 else -1
          roles_new = "\n".join([
              'const roleAliases: Record<string, string> = { admin: "admin", administrator: "admin", administrador: "admin", administracion: "admin", "administración": "admin", owner: "admin", cobranza: "cobranza", collection: "cobranza", collector: "cobranza", registro: "registro", registrador: "registro", registro_clientes: "registro", registro_de_clientes: "registro", "registro de clientes": "registro", registration: "registro", gestor: "gestor" };',
              'const roles = [...new Set((roleRows ?? []).map((row: { role?: string }) => roleAliases[String(row.role ?? "").trim().toLowerCase()] ?? "").filter((role: string) => Boolean(role)))];',
              "return jsonResponse(req, { roles });",
          ])
          if start >= 0 and end >= 0:
              source = source[:start] + roles_new + source[end + len(marker):]
          elif "const roleAliases: Record<string, string>" not in source:
              raise SystemExit("No se reconoció my_roles; se cancela el despliegue.")
          p.write_text(source, encoding="utf-8")
          print("my_roles corregido: roles múltiples y variantes de nombres normalizados.")
          PY

          # Corregir CORS de la Edge Function en cada despliegue. El ZIP puede contener una copia antigua.
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("supabase/functions/administrar-usuarios/index.ts")
          if not p.is_file():
              raise SystemExit("Falta la Edge Function administrar-usuarios/index.ts")

          source = p.read_text(encoding="utf-8")
          origins = '''const ALLOWED_ORIGINS = new Set([
            "https://s17780301-coder.github.io",
            "https://appassets.androidplatform.net",
            "https://localhost",
            "http://localhost",
            "capacitor://localhost",
            "ionic://localhost",
          ]);'''
          pattern = r'const ALLOWED_ORIGINS = new Set\(\[\s*"https://s17780301-coder\.github\.io",\s*\]\);'
          source, changed = re.subn(pattern, origins, source, count=1)
          if changed == 0 and '"https://appassets.androidplatform.net"' not in source:
              raise SystemExit("No se pudo actualizar ALLOWED_ORIGINS; se cancela el despliegue para evitar publicar una función sin corregir.")

          old_headers = '"authorization, x-client-info, apikey, content-type"'
          new_headers = '"authorization, x-client-info, apikey, content-type, x-supabase-api-version, x-supabase-client-platform, x-supabase-client-version, x-supabase-client-runtime, x-supabase-client-runtime-version"'
          if old_headers in source:
              source = source.replace(old_headers, new_headers, 1)
          elif "x-supabase-client-platform" not in source:
              raise SystemExit("No se pudieron actualizar los encabezados CORS; se cancela el despliegue.")

          if '"https://appassets.androidplatform.net"' not in source or "x-supabase-client-platform" not in source:
              raise SystemExit("Falló la verificación final de CORS; no se publicará una función incorrecta.")

          p.write_text(source, encoding="utf-8")
          print("CORS verificado: portal web + Android WebView + encabezados Supabase.")
          PY

          # Añadir delete_user porque la interfaz de Usuarios incluye esa acción.
          # Protege la cuenta actual y el último administrador antes de borrar en Auth.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/functions/administrar-usuarios/index.ts")
          if not p.is_file():
              raise SystemExit("Falta la Edge Function administrar-usuarios/index.ts")
          source = p.read_text(encoding="utf-8")
          if 'if (action === "delete_user")' not in source:
              marker = 'return jsonResponse(\nreq,\n{\nerror: "Acción no reconocida."'
              if source.count(marker) != 1:
                  raise SystemExit("No se encontró de forma única el bloque de acción no reconocida; no se modificó la función.")
              handler = r"""
          if (action === "delete_user") {
          const userId = String(body.user_id ?? "").trim();
          if (!userId) {
          return jsonResponse(req, { error: "Falta user_id." }, 400);
          }
          if (userId === callerData.user.id) {
          return jsonResponse(req, { error: "No puedes eliminar tu propia cuenta desde Administración." }, 400);
          }

          const { data: targetData, error: targetError } =
