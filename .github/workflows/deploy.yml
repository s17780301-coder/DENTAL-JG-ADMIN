                  out = recolor(rgb)
                  return "#" + "".join(f"{v:02x}" for v in out) + raw[3].lower()
              if len(raw) in (6, 8):
                  rgb = tuple(int(raw[i:i+2], 16) for i in (0, 2, 4))
                  out = recolor(rgb)
                  suffix = raw[6:].lower() if len(raw) == 8 else ""
                  return "#" + "".join(f"{v:02x}" for v in out) + suffix
              return token

          def rgb_repl(m):
              token = m.group(0)
              nums = re.findall(r"[-+]?(?:\d*\.\d+|\d+)%?", token)
              if len(nums) < 3:
                  return token
              vals = []
              for n in nums[:3]:
                  if n.endswith("%"):
                      vals.append(round(float(n[:-1]) * 2.55))
                  else:
                      vals.append(round(float(n)))
              if any(v < 0 or v > 255 for v in vals):
                  return token
              out = recolor(tuple(vals))
              # Mantener alpha, separadores y sintaxis del color del original no es necesario visualmente;
              # emitir RGB estándar compatible con CSS.
              alpha = ""
              if len(nums) >= 4:
                  alpha = ", " + nums[3]
              return "rgb(" + ", ".join(map(str, out)) + alpha + ")"

          def hsl_repl(m):
              global changed_total
              token = m.group(0)
              nums = re.findall(r"[-+]?(?:\d*\.\d+|\d+)%?", token)
              if len(nums) < 3:
                  return token
              try:
                  hue = float(nums[0]) % 360
                  sat = float(nums[1].rstrip("%")) / (100 if nums[1].endswith("%") else 1)
                  light = float(nums[2].rstrip("%")) / (100 if nums[2].endswith("%") else 1)
              except ValueError:
                  return token
              if not (185 <= hue <= 265 and sat >= 0.16):
                  return token
              changed_total += 1
              return f"hsl(171, {sat*100:.1f}%, {light*100:.1f}%)"

          for path in targets:
              if not path.is_file():
                  continue
              original = path.read_text(encoding="utf-8")
              out = re.sub(r"#[0-9a-fA-F]{3,8}\b", hex_repl, original)
              out = re.sub(r"rgba?\([^)]*\)", rgb_repl, out, flags=re.I)
              out = re.sub(r"hsla?\([^)]*\)", hsl_repl, out, flags=re.I)
              if out != original:
                  path.write_text(out, encoding="utf-8")
                  print(f"Colores azules actualizados en {path}: {len(original)} -> {len(out)} caracteres.")
          print(f"Colores azulados convertidos a turquesa: {changed_total}")
          if changed_total == 0:
              print("Aviso: no se encontraron colores literales azules; revisar si la página usa colores externos o canvas.")
          PY

          # Aplicar tema verde turquesa sin reemplazar la estructura ni el comportamiento del panel.
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path("public/styles.css")
          if not css.is_file():
              raise SystemExit("No se encontró public/styles.css; se cancela el despliegue para evitar publicar un tema incompleto.")
          source = css.read_text(encoding="utf-8")
          marker = "/* DENTAL_JG_TURQUOISE_THEME */"
          if marker not in source:
              source += r"""

          /* DENTAL_JG_TURQUOISE_THEME */
          :root {
            --primary: #079b87 !important;
            --primary-color: #079b87 !important;
            --accent: #16b8a6 !important;
            --accent-color: #16b8a6 !important;
            --brand: #078f80 !important;
            --focus: #21bfae !important;
            --link: #078f80 !important;
            --blue: #079b87 !important;
          }
          /* Sobrescribir los azules del diseño original, incluidos fondos y cabeceras. */
          /* Sobrescribir también clases reales del paquete ZIP, aunque no usen nombres estándar. */
          body {
            background-color: #eef9f6 !important;
          }
          :where([class*="hero"], [class*="Hero"], [class*="banner"], [class*="Banner"], [class*="header"], [class*="Header"], [class*="welcome"], [class*="Welcome"], [class*="brand"], [class*="Brand"]) {
            --primary: #079b87 !important;
            --accent: #16b8a6 !important;
          }
          :where([class*="hero"], [class*="Hero"], [class*="banner"], [class*="Banner"], [class*="welcome"], [class*="Welcome"])::before,
          :where([class*="hero"], [class*="Hero"], [class*="banner"], [class*="Banner"], [class*="welcome"], [class*="Welcome"])::after {
            border-color: #16b8a6 !important;
          }
          /* Forzar el color turquesa en botones, títulos de marca y enlaces incluso si el CSS base es más específico. */
          body :where(button, [role="button"], .btn, a[ class ]) {
            accent-color: #079b87;
          }

          /* Cabecera de portada: conservar la tarjeta clara para que los textos tengan contraste. */
          /* La portada debe conservar la tarjeta blanca; el degradado solo vive en el fondo superior. */
          #appPicker .portal-header {
            background: #ffffff !important;
            background-image: none !important;
            color: #173b59 !important;
            border: 1px solid #d7e9ef !important;
            box-shadow: 0 18px 55px #123e5b18 !important;
            opacity: 1 !important;
          }
          #appPicker .portal-header .portal-brand,
          #appPicker .portal-header #portalTitle,
          #appPicker .portal-header .eyebrow {
            color: #087f75 !important;
            opacity: 1 !important;
            text-shadow: none !important;
          }
          #appPicker .portal-header .portal-subtitle {
            color: #587a76 !important;
            opacity: 1 !important;
            text-shadow: none !important;
          }
          #appPicker .app-name { color: #18375b !important; }
          #appPicker .app-description { color: #607f8e !important; }
          :where(a, .link) { color: #078f80 !important; }
          :where(.primary, .btn-primary, button.primary, button[type="submit"], .button-primary, .active, .selected, [aria-current="page"]) {
            background-color: #079b87 !important;
            border-color: #079b87 !important;
            --primary: #079b87 !important;
            --accent: #16b8a6 !important;
          }
          :where(button.primary, .btn-primary, button[type="submit"], .primary):hover {
            background-color: #067d70 !important;
            border-color: #067d70 !important;
          }
          :where(input, select, textarea, button, a):focus-visible {
            outline-color: #16b8a6 !important;
            box-shadow: 0 0 0 3px rgb(22 184 166 / 20%) !important;
          }
          :where(.badge, .status-dot, .success, .online, .nav-link.active, .tab.active) {
            --primary: #079b87 !important;
            --accent: #16b8a6 !important;
          }
          :where(.icon-box, .app-icon, .module-icon, .card-icon) {
            background: linear-gradient(135deg, #e0f8f3, #dff6fb) !important;
            color: #078f80 !important;
          }
          """
              css.write_text(source, encoding="utf-8")
              print("Tema verde turquesa aplicado a estilos del panel.")
          else:
              print("Tema verde turquesa ya presente; no se duplica.")

          # Corrección final de la tarjeta central: se aplica en cada despliegue,
          # incluso si el bloque de tema turquesa ya existía en styles.css.
          css = Path("public/styles.css")
          source = css.read_text(encoding="utf-8")
          fix_marker = "/* DENTAL_JG_PORTAL_WHITE_FIX_2 */"
          if fix_marker in source:
              source = source[:source.index(fix_marker)].rstrip()
          source += r"""

          /* DENTAL_JG_PORTAL_WHITE_FIX_2 */
          #appPicker > .portal-header,
          #appPicker header.portal-header,
          body #appPicker .portal-wrap .portal-header {
            background: #ffffff !important;
            background-color: #ffffff !important;
            background-image: none !important;
            color: #173b59 !important;
            opacity: 1 !important;
            filter: none !important;
            mix-blend-mode: normal !important;
            isolation: isolate !important;
          }
          #appPicker > .portal-header::before,
          #appPicker > .portal-header::after,
          #appPicker header.portal-header::before,
          #appPicker header.portal-header::after {
            content: none !important;
            display: none !important;
            background: none !important;
            background-image: none !important;
          }
          #appPicker .portal-header .portal-brand,
          #appPicker .portal-header #portalTitle,
          #appPicker .portal-header .eyebrow {
            color: #087f75 !important;
