name: Publicar panel DENTAL JG (restauración 10.8.91)

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'DENTAL_JG_PANEL_ROLES_RECONSTRUIDO_DESDE_CERO.zip'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validar y preparar panel restaurado
        shell: bash
        run: |
          set -euo pipefail
          ZIP='DENTAL_JG_PANEL_ROLES_RECONSTRUIDO_DESDE_CERO.zip'
          test -s "$ZIP" || { echo '::error::Falta el ZIP maestro 10.8.91'; exit 1; }
          unzip -tq "$ZIP"
          mkdir -p extracted public
          unzip -oq "$ZIP" -d extracted
          mapfile -t INDEX_FILES < <(find extracted -type f -name index.html -print)
          if [ "${#INDEX_FILES[@]}" -ne 1 ]; then
            echo "::error::Se esperaba un index.html; encontrados: ${#INDEX_FILES[@]}"
            printf '%s\n' "${INDEX_FILES[@]}"
            exit 1
          fi
          PANEL_DIR="$(dirname "${INDEX_FILES[0]}")"
          for f in index.html app.js config.js styles.css users.js logo-dental-jg.png; do
            test -s "$PANEL_DIR/$f" || { echo "::error::Falta $f en el paquete"; exit 1; }
          done
          cp -a "$PANEL_DIR"/. public/
          touch public/.nojekyll
          echo 'Archivos web listos:'
          find public -maxdepth 2 -type f -printf '%P\n' | sort
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
