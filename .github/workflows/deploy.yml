
      - name: Preparar archivos del panel
        shell: bash
        run: |
          set -euo pipefail

          ZIP="DENTAL_JG_PANEL_10_8_92_REPARACION_CARGA_USUARIOS_4.zip"

          echo "Directorio actual:"
          pwd
          echo "Archivos disponibles:"
          ls -la

          test -f "$ZIP" || {
            echo "::error::No se encontró el ZIP: $ZIP"
            exit 1
          }

          mkdir -p extracted public
          unzip -oq "$ZIP" -d extracted

          echo "Archivos extraídos:"
          find extracted -maxdepth 4 -type f -print

          INDEX="$(find extracted -type f -name index.html -print -quit)"
          test -n "$INDEX" || {
            echo "::error::El ZIP no contiene index.html"
            exit 1
          }

          PANEL_DIR="$(dirname "$INDEX")"
          echo "Carpeta del panel: $PANEL_DIR"

          for file in index.html styles.css app.js config.js users.js logo-dental-jg.png; do
            if [ ! -f "$PANEL_DIR/$file" ]; then
              echo "::error::Falta el archivo $file en $PANEL_DIR"
              exit 1
            fi
            cp "$PANEL_DIR/$file" public/
          done

          test -f public/index.html
          echo "Archivos preparados correctamente:"
          ls -la public
          
